name: Legacy PCBoard 2.0 Build

# Retained temporarily for manual comparison only. PCBoard 3.0 is built by
# build-pcboard-foundation.yml from the pinned LeanType foundation.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build legacy debug APK
        id: android_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PCBoard-legacy-build-log
          path: android-build.log
          if-no-files-found: error
      - name: Upload legacy APK
        if: steps.android_build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: PCBoard-2.0-legacy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
